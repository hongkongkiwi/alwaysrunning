[package]
name = "alwaysrunning"
version = "0.1.2"
edition = "2024"
description = "A tiny process supervisor for long-running binaries. No YAML. No unit files. No Kubernetes."
repository = "https://github.com/hongkongkiwi/alwaysrunning"
license = "MIT"
keywords = ["cli", "supervisor", "process-manager", "daemon"]
categories = ["command-line-utilities", "os::unix-apis", "system-administration"]

[[bin]]
name = "alwaysrunning"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
home = "0.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
