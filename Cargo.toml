[package]
name = "alwaysrunning"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
home = "0.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
